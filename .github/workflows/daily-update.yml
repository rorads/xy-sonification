name: Daily Update

on:
  schedule:
    # Run daily at 9:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Puppeteer
      run: npm install puppeteer
    
    - name: Wake up Streamlit app
      run: node scripts/riseshine.js
    
    - name: Update log file
      run: |
        echo "App wake-up completed: $(date)" >> daily-log.txt
        echo "Automated wake-up #$(date +%s)" >> daily-log.txt
        echo "" >> daily-log.txt
    
    - name: Upload screenshots (if any)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: wake-up-screenshots
        path: "*.png"
        if-no-files-found: ignore
    
    - name: Commit and push changes
      run: |
        git add daily-log.txt
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Daily app wake-up completed - $(date -I)"
          git push origin master
        fi